<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="description" content="Blast Off is a platformer where you launch yourself in the direction you want to go!">
  <link rel="stylesheet" href="styles.css">
  <script src = "other.js" defer></script>
</head>
<body>
    <div id = "main_menu_div">
        <div id = "content_div">
            <div id = "row">
                <button id = "rat"> Play!</button>
                <h1> Meow's Harvest:</h1>
            </div>
            <div id = "grid">
                <div class = "item">
                    <h3> Launch the ball to move</h3>
                    <img id = "ins" src = "assets/move-ins.PNG"/>
                </div>
                <div class = "item">
                    <h3> Avoid spikes</h3>
                    <img id = "ins" src = "assets/spike-ins.PNG"/>
                </div>
                <div class = "item">
                    <h3> Avoid lazers</h3>
                    <img id = "ins" src = "assets/lazer-ins.PNG"/>
                </div>
                <div class = "item">
                    <h3> Use portals to get to new locations </h3>
                    <img id = "ins" src = "assets/temp2.jpg"/>
                </div>
                <div class = "item">
                    <h3> Some platforms crumble if you stay too long!</h3>
                    <img id = "ins" src = "assets/temp2.jpg"/>
                </div>
                <div class = "item">
                    <h3> Pumpkins unlock new paths </h3>
                    <img id = "ins" src = "assets/pump-ins.PNG"/>
                </div>
                <div class = "item">
                    <h3> Get to the end of the level! </h3>
                    <img id = "ins" src = "assets/end-ins.PNG"/>
                </div>
            </div>
        </div>
        <div id = "bg_div">
            <img id = "long_img" src = "assets/harvestbg.jpg" alt = "a drawing of a field with pumping and autum leaves"/>
        </div>
    </div>

</body>
