<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="description" content="Bounce is a platformer where you launch yourself in the direction you want to go! Navigate through the sea, dessert, space, and more!">
  <title>Bounce</title>
  <script src="levels.js" defer></script>
  <script src="script.js" defer></script>
  <script src="music.js" defer></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="game" aria-label="Third Space platformer"></canvas>
  <div class="hud">
    <button id="musicButton" class="music-button" type="button" aria-label="Play music" title="Play music">
      <span class="music-button-light" aria-hidden="true"></span>
      <span class="music-button-label">Radio</span>
    </button>
    <div class="topline">
      <div>
        <div class="brand"><span class="brand-mark">+</span> Bounce</div>
        <div class="world-name"><span id="worldName"></span><span class="dot">/</span><span id="worldHint">Welcome</span></div>
      </div>
      <div class="stats">
        <div><span>Attempts</span><strong id="deaths">0</strong></div>
        <div><span>Distance</span><strong><span id="distance">0</span></strong></div>
        <div>Level<strong id="worldNumber">1 / 8</strong></div> <!-- Gotta not hard code this at some point sob -->
      </div>
    </div>
    <div class="progress"><span id="progressBar"></span></div>
    <div class="help"><b>Pull back, release</b><span>Reach the goal. Arrow keys also launch.</span></div>
    <div class="controls">
      <button id="pause" type="button" aria-label="Pause game">Pause</button>
      <button id="restart" type="button">Restart (R)</button>
      <button id="next" type="button" class="hidden">Next level</button>
    </div>
  </div>
  <div id="overlay" class="overlay hidden">
      <div class="panel">
        <h1 id="overlayTitle"></h1>
        <p id="overlayText"></p>
        <div id="overlayStats" class="overlay-stats"></div>
        <button id="overlayButton" type="button"></button>
      </div>
      <img class = "bg" src = "assets/harvestbg.jpg"/>
    </div>
  </div>
</body>
</html>
